# Local PostgreSQL for the registry API (packages/api). Synthetic data only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: contractpulse
      POSTGRES_PASSWORD: contractpulse
      POSTGRES_DB: contractpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractpulse -d contractpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
